name: fAuth
main: pt.flawless.fAuth.FAuth
description: Server auth
version: 1.0
depend: [fAPI, fDatabase]
commands:
  login:
    description: Login into a player's account
    aliases:
      - logar
  register:
    description: Register a player's account
    aliases:
      - registar
  manterlogin:
    description: Guarda a sessão neste IP durante alguns dias (volta a usar para desligar)
    usage: "Uso: /manterlogin"
